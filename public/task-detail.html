<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-8">

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 border-b pb-4">
            <div class="flex items-center">
                <a href="index.html" class="text-gray-500 hover:text-gray-800 mr-4">← Back</a>
                <h1 class="text-2xl font-bold">Edit Task</h1>
            </div>
            <!-- Dynamic Status Badge -->
            <div id="status-badge-container"></div>
        </div>

        <div id="loading-message" class="text-center text-gray-500 py-4">Loading task details...</div>

        <!-- Form (Hidden until data loads) -->
        <form id="edit-task-form" class="hidden">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Task Title *</label>
                <input type="text" id="title" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="description" rows="4" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500"></textarea>
            </div>

            <div class="grid grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                    <input type="date" id="due-date" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 transition-all cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                    <div class="relative">
                        <select id="priority" class="appearance-none w-full border border-gray-300 rounded px-3 py-2 pr-8 text-sm focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 cursor-pointer bg-white transition-all hover:bg-gray-50">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <div class="relative">
                        <select id="status" class="appearance-none w-full border border-gray-300 rounded px-3 py-2 pr-8 text-sm focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 cursor-pointer bg-white transition-all hover:bg-gray-50">
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <div id="error-message" class="text-red-500 text-sm mb-4 hidden"></div>

            <!-- Buttons -->
            <div class="flex justify-between items-center pt-4 border-t">
                <button type="button" id="delete-btn" class="text-red-600 text-sm hover:underline hover:text-red-800 transition">Delete Task</button>
                
                <div class="flex space-x-3">
                    <a href="index.html" class="px-4 py-2 border border-gray-300 rounded text-sm text-gray-700 hover:bg-gray-50 transition">Cancel</a>
                    <button type="submit" id="submit-btn" class="bg-gray-900 text-white px-4 py-2 rounded text-sm hover:bg-gray-800 transition">Update Task</button>
                </div>
            </div>
        </form>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // 1. Get the Task ID from the URL (e.g., ?id=5)
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');

        if (!taskId) {
            alert("No task ID provided.");
            window.location.href = 'index.html';
        }

        // 2. Fetch the existing task data
        async function loadTask() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) window.location.href = 'login.html';

            const { data: task, error } = await supabaseClient
                .from('tasks')
                .select('*')
                .eq('id', taskId)
                .single();

            if (error || !task) {
                alert("Task not found or you don't have permission to view it.");
                window.location.href = 'index.html';
                return;
            }

            // Populate the form fields
            document.getElementById('title').value = task.title;
            document.getElementById('description').value = task.description || '';
            document.getElementById('priority').value = task.priority;
            document.getElementById('status').value = task.status;
            
            // Format the date properly for the HTML input (YYYY-MM-DD)
            if (task.due_date) {
                document.getElementById('due-date').value = task.due_date.substring(0, 10);
            }

            // Create the visual status badge
            let badgeClass = "border px-2 py-1 text-xs rounded bg-gray-50 text-gray-700";
            if (task.status === "Completed") badgeClass = "border border-green-300 px-2 py-1 text-xs rounded bg-green-50 text-green-700";
            if (task.status === "In Progress") badgeClass = "border border-blue-300 px-2 py-1 text-xs rounded bg-blue-50 text-blue-700";
            document.getElementById('status-badge-container').innerHTML = `<span class="${badgeClass}">${task.status}</span>`;

            // Swap visibility
            document.getElementById('loading-message').classList.add('hidden');
            document.getElementById('edit-task-form').classList.remove('hidden');
        }

        // 3. Handle Update (Form Submission)
        document.getElementById('edit-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('hidden');
            submitBtn.textContent = "Updating...";
            submitBtn.disabled = true;

            const dueDateVal = document.getElementById('due-date').value;

            try {
                const { error } = await supabaseClient
                    .from('tasks')
                    .update({
                        title: document.getElementById('title').value,
                        description: document.getElementById('description').value,
                        due_date: dueDateVal ? dueDateVal : null,
                        priority: document.getElementById('priority').value,
                        status: document.getElementById('status').value,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', taskId);

                if (error) throw error;
                window.location.href = 'index.html';

            } catch (err) {
                console.error(err);
                errorDiv.textContent = "Failed to update task.";
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = "Update Task";
                submitBtn.disabled = false;
            }
        });

        // 4. Handle Delete Button
        document.getElementById('delete-btn').addEventListener('click', async () => {
            const confirmDelete = confirm("Are you sure you want to delete this task? This action cannot be undone.");
            
            if (confirmDelete) {
                try {
                    const { error } = await supabaseClient
                        .from('tasks')
                        .delete()
                        .eq('id', taskId);

                    if (error) throw error;
                    window.location.href = 'index.html';
                } catch (err) {
                    alert("Failed to delete task.");
                    console.error(err);
                }
            }
        });

        // Initialize the page
        document.addEventListener('DOMContentLoaded', loadTask);
    </script>
</body>
</html>
