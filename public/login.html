<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col justify-center items-center">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Task Manager</h1>
        <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 max-w-md w-full">
        <form id="login-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>

            <div id="error-message" class="text-red-500 text-sm mb-4 hidden"></div>

            <button type="submit" id="submit-btn" class="w-full bg-gray-900 text-white font-medium py-2 rounded hover:bg-gray-800 transition">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span class="text-gray-600">No account?</span> 
            <a href="register.html" class="text-blue-600 hover:underline">Register →</a>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');

            errorDiv.classList.add('hidden');
            submitBtn.textContent = "Signing In...";
            submitBtn.disabled = true;

            // Call Supabase to authenticate
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = "Sign In";
                submitBtn.disabled = false;
            } else {
                // Success. Redirect to the main dashboard
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
