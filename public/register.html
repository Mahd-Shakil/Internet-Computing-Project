<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col justify-center items-center">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Task Manager</h1>
        <p class="text-gray-500 text-sm mt-1">Create your account</p>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 max-w-md w-full">
        <form action="login.html" method="GET">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" placeholder="Your full name" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" placeholder="••••••••" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" placeholder="••••••••" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>

            <button type="submit" class="w-full bg-gray-900 text-white font-medium py-2 rounded hover:bg-gray-800 transition">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span class="text-gray-600">Already have an account?</span> 
            <a href="login.html" class="text-blue-600 hover:underline">Sign in →</a>
        </div>
    </div>

</body>
</html>
