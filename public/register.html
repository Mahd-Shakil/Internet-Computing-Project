<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. Load Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col justify-center items-center">

    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Task Manager</h1>
        <p class="text-gray-500 text-sm mt-1">Create your account</p>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 max-w-md w-full">
        <!-- Add an ID to the form and remove the action attribute -->
        <form id="register-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="full-name" placeholder="Your full name" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required minlength="6">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="••••••••" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-gray-500" required>
            </div>

            <div id="error-message" class="text-red-500 text-sm mb-4 hidden"></div>

            <button type="submit" id="submit-btn" class="w-full bg-gray-900 text-white font-medium py-2 rounded hover:bg-gray-800 transition">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span class="text-gray-600">Already have an account?</span> 
            <a href="login.html" class="text-blue-600 hover:underline">Sign in →</a>
        </div>
    </div>

    <!-- 2. Load Configuration and Auth Logic -->
    <script src="supabase-config.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload
            
            const fullName = document.getElementById('full-name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');

            errorDiv.classList.add('hidden');

            if (password !== confirmPassword) {
                errorDiv.textContent = "Passwords do not match.";
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.textContent = "Creating Account...";
            submitBtn.disabled = true;

            // Call Supabase to create the user
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName // Save the custom full name field
                    }
                }
            });

            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                submitBtn.textContent = "Create Account";
                submitBtn.disabled = false;
            } else {
                // Success. Redirect to the login page
                alert("Account created successfully! Please log in.");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
